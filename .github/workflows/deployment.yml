name: Continuous Deployment

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deployment-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deployment:
    if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
    uses: jaudiger/reusable-workflows/.github/workflows/deploy-zine-cloudflare-pages.yml@3839cfd022d5da89a6c5d3b31f5aa1e9b7fed2ec
    with:
      output-dir: "public"
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
